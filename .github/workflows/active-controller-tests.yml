name: Active controller regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest voluptuous
      - name: Prüfe Einrichtung, Mengenbegrenzung und Gerätebefehle
        run: >-
          python -m pytest -q
          tests/test_native_beta2.py
          tests/test_native_device_setup.py
          tests/test_dev1_5_cell_voltage_and_house_load.py
          tests/test_native_power_controller.py
      - name: Vergleiche Fehler mit dem Basiscommit
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" 6c59d9f9e68321fd6a96560cdca557d2c0f31165
          (cd "$RUNNER_TEMP/base" && python -m pytest -q --tb=no > "$RUNNER_TEMP/base-pytest.txt") || test $? -eq 1
          python -m pytest -q --tb=no > "$RUNNER_TEMP/pr-pytest.txt" || test $? -eq 1
          tail -n 1 "$RUNNER_TEMP/base-pytest.txt"
          tail -n 1 "$RUNNER_TEMP/pr-pytest.txt"
          awk '/^(FAILED|SUBFAILED)/' "$RUNNER_TEMP/base-pytest.txt" | sort -u > "$RUNNER_TEMP/base-failures.txt"
          awk '/^(FAILED|SUBFAILED)/' "$RUNNER_TEMP/pr-pytest.txt" | sort -u > "$RUNNER_TEMP/pr-failures.txt"
          comm -13 "$RUNNER_TEMP/base-failures.txt" "$RUNNER_TEMP/pr-failures.txt" > "$RUNNER_TEMP/new-failures.txt"
          cat "$RUNNER_TEMP/new-failures.txt"
          test ! -s "$RUNNER_TEMP/new-failures.txt"
